// LMCache-driven transfer wire contract for LMCache mp-mode gRPC.

syntax = "proto3";

package lmcache.mp;

import "common.proto";

message RegisterKvCacheRequest {
  int64 instance_id = 1;
  repeated DeviceIpcWrapper kv_cache = 2;
  string model_name = 3;
  int64 world_size = 4;
  string engine_type = 5;
  bytes encoded_layout_hints = 6;
  repeated EngineGroupInfo engine_group_infos = 7;
}

message RegisterKvCacheResponse {}

// Fixed tuple (start, end); field order matches the structural tuple codec.
message PPLayerRange {
  int64 start = 1;
  int64 end = 2;
}

message PPStageLocator {
  string base_model_name = 1;
  int64 tp_size = 2;
  int64 pp_size = 3;
  int64 pp_rank = 4;
  repeated PPLayerRange layer_ranges = 5;
  int64 schema_version = 6;
}

message PPRegistrationInfo {
  PPStageLocator locator = 1;
  int64 global_rank = 2;
  int64 tp_rank = 3;
  repeated string layer_names = 4;
  string registration_token = 5;
  bool mla_only = 6;
}

message PPStageProfile {
  PPStageLocator locator = 1;
  repeated string layer_names = 2;
  bool mla_only = 3;
  string layout_json = 4;
}

message RegisterPpKvCacheRequest {
  int64 instance_id = 1;
  repeated DeviceIpcWrapper kv_cache = 2;
  string model_name = 3;
  int64 world_size = 4;
  string engine_type = 5;
  bytes encoded_layout_hints = 6;
  repeated EngineGroupInfo engine_group_infos = 7;
  PPRegistrationInfo registration_info = 8;
}

// Mirrors PPRegistrationAck directly, without derived namespace properties.
message RegisterPpKvCacheResponse {
  PPStageProfile profile = 1;
  string server_instance_id = 2;
  int64 instance_id = 3;
  int64 tp_rank = 4;
}

message GetPpStageStatusRequest {
  PPStageLocator locator = 1;
}

message GetPpStageStatusResponse {
  PPStageLocator locator = 1;
  string server_instance_id = 2;
  optional PPStageProfile profile = 3;
  repeated int64 registered_tp_ranks = 4;
  int64 schema_version = 5;
}

message UnregisterKvCacheRequest {
  int64 instance_id = 1;
}

message UnregisterKvCacheResponse {}

message StoreRequest {
  IpcCacheServerKey key = 1;
  int64 instance_id = 2;
  repeated BlockIdGroup gpu_block_ids = 3;
  bytes event_ipc_handle = 4;
}

message StoreResponse {
  EventIpcHandleResult result = 1;
}

message RetrieveRequest {
  IpcCacheServerKey key = 1;
  int64 instance_id = 2;
  repeated BlockIdGroup gpu_block_ids = 3;
  bytes event_ipc_handle = 4;
  int64 skip_first_n_tokens = 5;
}

message RetrieveResponse {
  EventIpcHandleResult result = 1;
}

service LMCacheDrivenService {
  rpc RegisterKvCache(RegisterKvCacheRequest) returns (RegisterKvCacheResponse);
  rpc RegisterPpKvCache(RegisterPpKvCacheRequest)
      returns (RegisterPpKvCacheResponse);
  rpc GetPpStageStatus(GetPpStageStatusRequest) returns (GetPpStageStatusResponse);
  rpc UnregisterKvCache(UnregisterKvCacheRequest)
      returns (UnregisterKvCacheResponse);
  rpc Store(StoreRequest) returns (StoreResponse);
  rpc Retrieve(RetrieveRequest) returns (RetrieveResponse);
}
